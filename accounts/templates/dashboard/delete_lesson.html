{% extends 'base.html' %}
{% block content %}
<div class="container my-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 text-center p-5 bg-white">
                <div class="text-danger mb-4">
                    <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">Confirm Destruction</h3>
                <p class="text-muted mb-4">Are you absolutely sure you want to permanently delete <strong>"{{ object.title }}"</strong>? This action cannot be reversed and sandbox laboratory variables will be dropped.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg rounded-3 fw-bold py-3">
                            Yes, Permanently Delete
                        </button>
                        <a href="{% url 'mini_admin_lesson_list' %}" class="btn btn-light btn-lg rounded-3 text-muted py-3 border">
                            Cancel and Go Back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
