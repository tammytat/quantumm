{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{% static 'js/environment_bridge.js' %}"></script>
    <style>
        body { background: #111827; color: #fff; margin: 0; }
        .env-shell { min-height: 100vh; background: #111827; }
        .env-terminal { min-height: 96px; max-height: 160px; overflow: auto; background: #050816; color: #d1fae5; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    </style>
    {{ environment_config|json_script:"environment-config" }}
    {% block extra_head %}{% endblock %}
</head>
<body data-env-key="{{ env_key }}">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    <div class="env-shell" data-env-key="{{ env_key }}" data-lesson-id="{{ lesson_id }}" data-block-id="{{ block_id }}">
        {% block env_content %}{% endblock %}
    </div>

    <script>
        async function runCode(code, token, envType) {
            const response = await fetch("{% url 'validate_code' %}", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
                body: JSON.stringify({ code: code, token: token || "{{ lesson_id }}", env_type: envType || "{{ env_key }}" })
            });
            return await response.json();
        }

        window.environmentBridge = new EnvironmentBridge({
            envKey: "{{ env_key }}",
            lessonId: "{{ lesson_id }}",
            blockId: "{{ block_id }}",
            csrfToken: "{{ csrf_token }}"
        });

        document.addEventListener("DOMContentLoaded", function() {
            window.environmentBridge.init();
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
