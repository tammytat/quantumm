{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

<style>
    .auth-card {
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08) !important;
    }
    .auth-card .form-control {
        border-radius: 10px;
        padding: 12px 16px;
        border: 1.5px solid #e2e8f0;
        background-color: #f8fafc;
    }
    .auth-card .form-control:focus {
        background-color: #ffffff;
        border-color: #0d6efd;
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
    }
    .auth-card .btn-primary { border-radius: 12px; padding: 14px; }
</style>

<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card border-0 p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 bg-primary bg-opacity-10 rounded-4 text-primary mb-3">
                        <i class="bi bi-key-fill fs-2"></i>
                    </div>
                    <h2 class="fw-bold text-dark">Reset your password</h2>
                    <p class="text-secondary small">Enter the email on your account and we'll send a secure reset link.</p>
                </div>

                <form method="POST" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label fw-bold small text-secondary">Email address</label>
                        <input type="email" name="email" id="id_email"
                               class="form-control {% if form.email.errors %}is-invalid{% endif %}"
                               placeholder="you@example.com"
                               value="{{ form.email.value|default:'' }}" required autofocus>
                        {% if form.email.errors %}
                            <div class="invalid-feedback d-block mt-1 small">{{ form.email.errors.0 }}</div>
                        {% endif %}
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                        Send reset link <i class="bi bi-envelope-arrow-up ms-1"></i>
                    </button>
                </form>

                <div class="mt-4 pt-2 text-center border-top border-light">
                    <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none small">
                        <i class="bi bi-arrow-left-short"></i> Back to sign in
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
