{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 p-4 p-sm-5" style="border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.08)">
                <div class="text-center">
                    <div class="d-inline-flex p-3 bg-success bg-opacity-10 rounded-4 text-success mb-3">
                        <i class="bi bi-patch-check-fill fs-2"></i>
                    </div>
                    <h2 class="fw-bold text-dark">Password updated</h2>
                    <p class="text-secondary small mb-4">
                        Your password has been changed successfully. You can now sign in with your new credentials.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg fw-bold shadow-sm">
                        Sign in <i class="bi bi-arrow-right-short fs-4"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
